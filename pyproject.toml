[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drydock"
version = "0.1.0"
description = "Reproducible high-throughput virtual screening: ligand preparation and batch molecular docking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Drydock contributors" }]
keywords = ["virtual-screening", "molecular-docking", "autodock", "vina", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Runtime dependencies are pinned in pixi.lock, not here. This list exists so
# the package is installable in isolation; pixi is the supported install path.
dependencies = [
    "click",
    "numpy",
    "pandas",
    "tomli-w",
    "tqdm",
]

[project.scripts]
drydock = "drydock.cli:main"

[project.gui-scripts]
drydock-gui = "drydock.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drydock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
